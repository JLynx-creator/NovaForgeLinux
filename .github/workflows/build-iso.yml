name: Build NovaForge Linux ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "=== Freeing up disk space on Runner ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Build Dependencies
        run: |
          echo "=== Installing live-build and tools ==="
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            mtools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            isolinux \
            fdisk

      - name: Initialize live-build configuration
        run: |
          echo "=== Configuring build environment ==="
          make version

      - name: Compile ISO Image
        run: |
          echo "=== Starting compilation ==="
          # Execute build with sudo since live-build mounts loop devices and changes root namespaces
          sudo make iso

      - name: Print Build Log on Failure
        if: failure()
        run: |
          echo "=== Last 200 lines of build output ==="
          if [ -f build/build.log ]; then
            tail -n 200 build/build.log
          elif [ -f build.log ]; then
            tail -n 200 build.log
          else
            echo "build.log not found!"
            find . -name "*.log" -type f 2>/dev/null | head -10
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-build-error-log
          path: |
            build/build.log
            build.log
          retention-days: 2
          if-no-files-found: warn

      - name: Verify ISO Image
        run: |
          echo "=== Validating compilation artifact ==="
          make validate

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaForge-Linux-ISO
          path: |
            output/*.iso
            output/*.sha256
            output/*.md5
          retention-days: 5
          if-no-files-found: error
